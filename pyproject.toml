description = "Docker sandbox backend for LangChain Deep Agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.13.0",
    "deepagents>=0.5.7",
    "docker>=7.1.0",
    "dotenv>=0.9.9",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "langchain-tests>=1.1.7",
    "pydotenv>=0.0.7",
    "pytest-asyncio>=1.3.0",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
    "twisted>=25.5.0",
]
